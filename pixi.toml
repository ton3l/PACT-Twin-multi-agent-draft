[workspace]
authors = ["elton-nascimento <elton.felype.s.nascimento@gmail.com>"]
channels = ["conda-forge"]
name = "PACT-Twin-multi-agent"
platforms = ["linux-64", "win-64"]
version = "0.1.0"

[tasks]
start = "fastapi dev src/api.py"

[activation.env]
PYTHONPATH = "src"

[dependencies]
langgraph = ">=1.2.4,<2"
python = ">=3.14.5,<3.15"
langchain-ollama = ">=1.1.0,<2"
langchain = ">=1.3.9,<2"
fastapi = ">=0.141.1,<0.142"
uvicorn = ">=0.54.0,<0.55"
fastapi-cli = ">=0.0.32,<0.0.33"
langchain-groq = ">=1.1.3,<2"
python-dotenv = ">=1.2.3,<2"
