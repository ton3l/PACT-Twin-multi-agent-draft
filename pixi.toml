[workspace]
authors = ["elton-nascimento <elton.felype.s.nascimento@gmail.com>"]
channels = ["conda-forge"]
name = "PACT-Twin-multi-agent"
platforms = ["linux-64", "win-64"]
version = "0.1.0"

[tasks]
start = "python src/main.py"

[activation.env]
PYTHONPATH = "src"

[dependencies]
langgraph = ">=1.2.4,<2"
python = ">=3.14.5,<3.15"
langchain-ollama = ">=1.1.0,<2"
langchain = ">=1.3.9,<2"
ipython = ">=9.14.1,<10"
