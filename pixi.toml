[workspace]
channels = ["conda-forge"]
name = "PACT-Twin-multi-agent"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
start = "python main.py"
fastapi-dev = "fastapi dev"

[dependencies]
python = ">=3.14.4,<3.15"
fastapi = ">=0.136.1,<0.137"
pydantic = ">=2.13.4,<3"

[pypi-dependencies]
agno = ">=2.6.7, <3"
ollama = ">=0.6.2, <0.7"
openai = ">=2.37.0, <3"
